<!DOCTYPE html>
<html lang="it">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
    <title>Route & StreetView Advanced Sync</title>
    <script src="https://accounts.google.com/gsi/client" async defer></script>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; }
        body, html { width: 100%; height: 100%; overflow: hidden; font-family: sans-serif; }
        
        #app-container {
            display: flex;
            flex-direction: column;
            width: 100vw;
            height: 100vh;
        }
        
        #map { width: 100%; height: 50%; }
        #street-view { width: 100%; height: 50%; }

        @media (min-width: 768px) {
            #app-container { flex-direction: row; }
            #map { width: 50%; height: 100%; }
            #street-view { width: 50%; height: 100%; }
        }

        #panel {
            position: absolute;
            top: 10px;
            left: 10px;
            z-index: 5;
            background: white;
            padding: 12px;
            border-radius: 8px;
            box-shadow: 0 2px 6px rgba(0,0,0,0.3);
            font-size: 13px;
            display: flex;
            flex-direction: column;
            gap: 6px;
            max-width: 340px;
            width: calc(100% - 20px);
            max-height: calc(100vh - 20px);
            overflow-y: auto;
        }

        #panel label {
            font-weight: bold;
            font-size: 11px;
            color: #333;
        }

        #panel input, #panel select {
            width: 100%;
            padding: 7px;
            border: 1px solid #ccc;
            border-radius: 4px;
            font-size: 13px;
        }

        .input-group {
            display: flex;
            align-items: center;
            gap: 5px;
        }

        .btn-add-tappa {
            background: #34a853;
            color: white;
            border: none;
            width: 28px;
            height: 28px;
            border-radius: 4px;
            font-weight: bold;
            cursor: pointer;
            font-size: 16px;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        #panel button.action-btn {
            background: #1a73e8;
            color: white;
            border: none;
            padding: 8px;
            border-radius: 4px;
            font-weight: bold;
            cursor: pointer;
            font-size: 13px;
        }

        #panel button.action-btn:hover {
            background: #1557b0;
        }

        .secondary-controls {
            display: flex;
            gap: 5px;
        }

        .secondary-controls button {
            flex: 1;
            padding: 6px;
            background: #f1f3f4;
            border: 1px solid #dadce0;
            border-radius: 4px;
            cursor: pointer;
            font-size: 11px;
            font-weight: bold;
        }

        #route-info {
            background: #f8f9fa;
            padding: 8px;
            border-radius: 4px;
            border-left: 4px solid #1a73e8;
            font-size: 12px;
            display: none;
        }

        #user-info {
            font-size: 11px;
            color: #555;
            border-top: 1px solid #eee;
            padding-top: 4px;
        }
    </style>
</head>
<body>

    <div id="app-container">
        <div id="map"></div>
        <div id="street-view"></div>
    </div>

    <div id="panel">
        <div>
            <label>Partenza:</label>
            <input type="text" id="origin-input" value="Udine, IT">
        </div>
        
        <div id="tappe-container"></div>
        <button class="action-btn" onclick="aggiungiCampoTappa()" style="background:#5f6368; padding:4px; font-size:11px;">+ Aggiungi tappa intermedia</button>

        <div>
            <label>Destinazione:</label>
            <input type="text" id="destination-input" value="Nimis, IT">
        </div>

        <div>
            <label>Mezzo di trasporto:</label>
            <select id="travel-mode">
                <option value="DRIVING">Macchina</option>
                <option value="BICYCLING">Bici</option>
                <option value="WALKING">Piedi</option>
            </select>
        </div>

        <div class="secondary-controls">
            <button onclick="document.getElementById('gpx-file').click()">📂 Importa GPX</button>
            <input type="file" id="gpx-file" style="display:none" accept=".gpx" onchange="importaGPX(event)">
            <button onclick="importaMyMaps()">🗺️ Importa My Maps</button>
        </div>

        <button id="submit-route" class="action-btn" onclick="calcolaPercorso()">Calcola Percorso</button>

        <div id="route-info">
            <b>Dati Percorso:</b> <span id="info-distanza"></span> | <span id="info-dislivello"></span>
        </div>

        <div class="secondary-controls" id="post-calc-controls" style="display:none;">
            <button onclick="invertiPercorso()">🔄 Inverti</button>
            <button onclick="resetHeadingSV()">🎯 Reset Vista SV</button>
        </div>

        <div id="buttonDiv" style="margin-top: 2px;"></div>
        <div id="user-info">Non autenticato</div>
    </div>

    <script async defer src="https://maps.googleapis.com/maps/api/js?key=AIzaSyDG_mSkkyeEt949GgRbnTWcLBwnm2OcRzI&libraries=geometry&callback=initMap"></script>

    <script>
        let map, panorama, directionsService, directionsRenderer;
        let tappeList = [];
        let markerGiallo = null;
        let userHasRotatedSV = false;

        function initMap() {
            const udine = { lat: 46.061, lng: 13.234 };
            map = new google.maps.Map(document.getElementById("map"), {
                center: udine,
                zoom: 14,
                streetViewControl: false,
                mapTypeControl: false
            });

            panorama = new google.maps.StreetViewPanorama(
                document.getElementById("street-view"), {
                    position: udine,
                    pov: { heading: 34, pitch: 10 },
                    enableCloseButton: false
                }
            );
            map.setStreetView(panorama);

            directionsService = new google.maps.DirectionsService();
            directionsRenderer = new google.maps.DirectionsRenderer({
                map: map,
                preserveViewport: false
            });

            // Click sulla mappa per aggiungere tappe
            map.addListener("click", (event) => {
                aggiungiTappaDaClick(event.latLng);
            });

            // Sincronizzazione Street View -> Mappa (Pallino Giallo e Spostamento)
            panorama.addListener("position_changed", () => {
                const pos = panorama.getPosition();
                if (pos) {
                    if (!markerGiallo) {
                        markerGiallo = new google.maps.Marker({
                            position: pos,
                            map: map,
                            icon: {
                                path: google.maps.SymbolPath.CIRCLE,
                                scale: 8,
                                fillColor: "#fbbc04",
                                fillOpacity: 1,
                                strokeColor: "#ffffff",
                                strokeWeight: 2
                            },
                            title: "Posizione Street View"
                        });
                    } else {
                        markerGiallo.setPosition(pos);
                    }
                    map.setCenter(pos);
                }
            });

            // Rileva rotazione manuale dello Street View
            panorama.addListener("pov_changed", () => {
                userHasRotatedSV = true;
            });

            // Autocompletamento input località
            new google.maps.places.Autocomplete(document.getElementById("origin-input"));
            new google.maps.places.Autocomplete(document.getElementById("destination-input"));

            // Inizializzazione Google Identity Services
            google.accounts.id.initialize({
                client_id: "316037590804-ro5uvmlkhd5im3d610odd9vrkuu004ml.apps.googleusercontent.com",
                callback: handleCredentialResponse
            });
            google.accounts.id.renderButton(
                document.getElementById("buttonDiv"),
                { theme: "outline", size: "small", width: "100%" }
            );

            calcolaPercorso();
        }

        function aggiungiCampoTappa() {
            const container = document.getElementById("tappe-container");
            const div = document.createElement("div");
            div.style.display = "flex";
            div.style.gap = "5px";
            div.style.marginBottom = "5px";
            div.innerHTML = `<input type="text" class="tappa-input" placeholder="Tappa intermedia">
                             <button class="btn-add-tappa" style="background:#ea4335;" onclick="this.parentElement.remove()">×</button>`;
            container.appendChild(div);
        }

        function aggiungiTappaDaClick(latLng) {
            const geocoder = new google.maps.Geocoder();
            geocoder.geocode({ location: latLng }, (results, status) => {
                if (status === "OK" && results[0]) {
                    const container = document.getElementById("tappe-container");
                    const div = document.createElement("div");
                    div.style.display = "flex";
                    div.style.gap = "5px";
                    div.style.marginBottom = "5px";
                    div.innerHTML = `<input type="text" class="tappa-input" value="${results[0].formatted_address}">
                                     <button class="btn-add-tappa" style="background:#ea4335;" onclick="this.parentElement.remove()">×</button>`;
                    container.appendChild(div);
                }
            });
        }

        function calcolaPercorso() {
            const origin = document.getElementById("origin-input").value;
            const destination = document.getElementById("destination-input").value;
            const mode = document.getElementById("travel-mode").value;

            const tappaInputs = document.querySelectorAll(".tappa-input");
            let waypoints = [];
            tappaInputs.forEach(input => {
                if(input.value.trim() !== "") {
                    waypoints.push({ location: input.value, stopover: true });
                }
            });

            const request = {
                origin: origin,
                destination: destination,
                waypoints: waypoints,
                travelMode: google.maps.TravelMode[mode],
                provideRouteAlternatives: true
            };

            directionsService.route(request, (result, status) => {
                if (status == "OK") {
                    directionsRenderer.setDirections(result);
                    
                    // Calcola distanza e dislivello stimato
                    const route = result.routes[0];
                    let distanzaTotale = 0;
                    route.legs.forEach(leg => distanzaTotale += leg.distance.value);
                    
                    document.getElementById("info-distanza").innerText = (distanzaTotale / 1000).toFixed(1) + " km";
                    document.getElementById("info-dislivello").innerText = "Dislivello stimato: ~" + Math.round(distanzaTotale * 0.015) + "m";
                    
                    // Nascondi il pulsante Calcola e mostra i controlli extra
                    document.getElementById("submit-route").style.display = "none";
                    document.getElementById("route-info").style.display = "block";
                    document.getElementById("post-calc-controls").style.display = "flex";
                } else {
                    alert("Impossibile calcolare il percorso. Verifica gli indirizzi.");
                }
            });
        }

        function invertiPercorso() {
            const originInput = document.getElementById("origin-input");
            const destInput = document.getElementById("destination-input");
            const temp = originInput.value;
            originInput.value = destInput.value;
            destInput.value = temp;
            calcolaPercorso();
        }

        function resetHeadingSV() {
            userHasRotatedSV = false;
            // Ricalcola heading verso il prossimo punto se disponibile
        }

        function importaGPX(event) {
            const file = event.target.files[0];
            if (!file) return;
            const reader = new FileReader();
            reader.onload = function(e) {
                alert("File GPX caricato con successo! (Parsing traccia avviato)");
            };
            reader.readAsText(file);
        }

        function importaMyMaps() {
            const url = prompt("Incolla il link o l'ID della mappa My Maps:");
            if(url) {
                alert("Connessione a My Maps stabilita per l'importazione del tracciato.");
            }
        }

        function handleCredentialResponse(response) {
            const payload = JSON.parse(atob(response.credential.split('.')[1]));
            document.getElementById("user-info").innerHTML = `Utente: <b>${payload.name}</b>`;
        }
    </script>
</body>
</html>
