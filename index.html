<!DOCTYPE html>
<html lang="it">
<head>
    <meta charset="UTF-8">
    <title>Mappa e Street View - Google Maps Style</title>
    <link rel="stylesheet" href="style.css">
    <!-- Google Material Icons per lo stile coerente con Maps -->
    <link href="https://fonts.googleapis.com/icon?family=Material+Icons" rel="stylesheet">
</head>
<body>

    <!-- Pulsante per aprire il pannello se collassato -->
    <button id="sidebar-toggle" class="sidebar-toggle-btn" onclick="toggleSidebar()" title="Apri riquadro">
        <span class="material-icons">menu</span>
    </button>

    <!-- Pannello Laterale Sinistro (Stile Google Maps Directions) -->
    <div id="sidebar" class="sidebar">
        <div class="sidebar-header">
            <h3>Indicazioni stradali</h3>
            <button class="icon-btn" onclick="toggleSidebar()" title="Chiudi riquadro"><span class="material-icons">close</span></button>
        </div>

        <div class="controls-content">
            <!-- Modalità di viaggio (Icone stile Google Maps) -->
            <div id="travel-modes" class="travel-modes-container">
                <button class="travel-mode-btn active" onclick="setTravelMode('DRIVING', this)" title="Auto"><span class="material-icons">directions_car</span></button>
                <button class="travel-mode-btn" onclick="setTravelMode('WALKING', this)" title="A piedi"><span class="material-icons">directions_walk</span></button>
                <button class="travel-mode-btn" onclick="setTravelMode(bicycling, this)" title="In bicicletta" style="display:none;"></button>
            </div>
            <input type="hidden" id="travel-mode" value="DRIVING">
            
            <!-- Input Partenza e Arrivo con icone a pallino -->
            <div class="route-inputs-box">
                <div class="input-row-gmaps">
                    <span class="material-icons point-icon origin-dot">trip_origin</span>
                    <input type="text" id="origin-input" placeholder="Scegli il punto di partenza o clicca sulla mappa">
                    <span class="status-check" id="check-origin">✓</span>
                </div>

                <div id="tappe-container"></div>
                <button class="text-btn" onclick="aggiungiTappaIntermedia()">+ Aggiungi tappa</button>

                <div class="input-row-gmaps">
                    <span class="material-icons point-icon dest-dot">location_on</span>
                    <input type="text" id="destination-input" placeholder="Scegli la destinazione">
                    <span class="status-check" id="check-dest">✓</span>
                </div>
            </div>

            <button id="submit-route" class="primary-btn" onclick="calcolaPercorso()">Calcola Percorso</button>
            
            <div id="route-info" class="route-info-box" style="display:none;">
                <b>Distanza:</b> <span id="info-distanza">0 km</span><br>
                <span id="info-dislivello">Dislivello: ~0m</span>
            </div>

            <div id="post-calc-controls" class="post-calc-actions" style="display:none;">
                <button class="secondary-btn" onclick="invertiPercorso()"><span class="material-icons">swap_vert</span> Inverti</button>
                <button class="secondary-btn" onclick="mostraPulsanteCalcola()">Modifica</button>
            </div>

            <div class="gpx-import-box">
                <label class="file-label">Importa GPX <input type="file" id="gpx-file" accept=".gpx" onchange="importaGPX(event)" style="display:none;"></label>
            </div>

            <div id="buttonDiv" class="google-auth-box"></div>
            <div id="user-info"></div>
        </div>
    </div>

    <!-- Contenitore Principale Diviso a Metà (Mappa + Street View) -->
    <div id="split-container">
        <div id="map"></div>
        <div id="pano"></div>
    </div>

    <script src="script.js" defer></script>
</body>
</html>
