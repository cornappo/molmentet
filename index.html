<!DOCTYPE html>
<html lang="it">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
    <title>Route & StreetView Sync with Google Login</title>
    <script src="https://accounts.google.com/gsi/client" async defer></script>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; }
        body, html { width: 100%; height: 100%; overflow: hidden; font-family: sans-serif; }
        
        #app-container {
            display: flex;
            flex-direction: column;
            width: 100vw;
            height: 100vh;
        }
        
        #map { width: 100%; height: 50%; }
        #street-view { width: 100%; height: 50%; }

        @media (min-width: 768px) {
            #app-container { flex-direction: row; }
            #map { width: 50%; height: 100%; }
            #street-view { width: 50%; height: 100%; }
        }

        #panel {
            position: absolute;
            top: 10px;
            left: 10px;
            z-index: 5;
            background: white;
            padding: 12px;
            border-radius: 8px;
            box-shadow: 0 2px 6px rgba(0,0,0,0.3);
            font-size: 14px;
            display: flex;
            flex-direction: column;
            gap: 8px;
            max-width: 320px;
            width: calc(100% - 20px);
        }

        #panel label {
            font-weight: bold;
            font-size: 12px;
            color: #333;
        }

        #panel input {
            width: 100%;
            padding: 8px;
            border: 1px solid #ccc;
            border-radius: 4px;
            font-size: 14px;
        }

        #panel button {
            background: #1a73e8;
            color: white;
            border: none;
            padding: 9px;
            border-radius: 4px;
            font-weight: bold;
            cursor: pointer;
            font-size: 14px;
        }

        #panel button:hover {
            background: #1557b0;
        }

        #user-info {
            font-size: 12px;
            color: #555;
            margin-top: 4px;
            border-top: 1px solid #eee;
            padding-top: 6px;
        }
    </style>
</head>
<body>

    <div id="app-container">
        <div id="map"></div>
        <div id="street-view"></div>
    </div>

    <div id="panel">
        <div>
            <label for="origin-input">Partenza:</label>
            <input type="text" id="origin-input" value="Udine, IT">
        </div>
        <div>
            <label for="destination-input">Destinazione:</label>
            <input type="text" id="destination-input" value="Nimis, IT">
        </div>
        <button id="submit-route" onclick="calcolaPercorso()">Calcola Percorso</button>
        
        <!-- Pulsante Google Sign-In -->
        <div id="buttonDiv" style="margin-top: 5px;"></div>
        <div id="user-info">Non autenticato</div>
    </div>

    <script async defer src="https://maps.googleapis.com/maps/api/js?key=AIzaSyDG_mSkkyeEt949GgRbnTWcLBwnm2OcRzI&callback=initMap"></script>

    <script>
        let map, panorama, directionsService, directionsRenderer;

        function initMap() {
            const udine = { lat: 46.061, lng: 13.234 };
            map = new google.maps.Map(document.getElementById("map"), {
                center: udine,
                zoom: 14,
                streetViewControl: false,
                mapTypeControl: false
            });

            panorama = new google.maps.StreetViewPanorama(
                document.getElementById("street-view"), {
                    position: udine,
                    pov: { heading: 34, pitch: 10 },
                    enableCloseButton: false
                }
            );
            map.setStreetView(panorama);

            directionsService = new google.maps.DirectionsService();
            directionsRenderer = new google.maps.DirectionsRenderer({
                map: map,
                preserveViewport: false
            });

            calcolaPercorso();

            map.addListener("idle", () => {
                const center = map.getCenter();
                const svService = new google.maps.StreetViewService();
                
                svService.getPanorama({ location: center, radius: 50 }, (data, status) => {
                    if (status === "OK") {
                        panorama.setPosition(data.location.latLng);
                    }
                });
            });

            // Inizializzazione Google Identity Services con il tuo Client ID
            google.accounts.id.initialize({
                client_id: "316037590804-ro5uvmlkhd5im3d610odd9vrkuu004ml.apps.googleusercontent.com",
                callback: handleCredentialResponse
            });
            google.accounts.id.renderButton(
                document.getElementById("buttonDiv"),
                { theme: "outline", size: "large", width: "100%" }
            );
        }

        function handleCredentialResponse(response) {
            const responsePayload = parseJwt(response.credential);
            document.getElementById("user-info").innerHTML = `Benvenuto, <b>${responsePayload.name}</b> (${responsePayload.email})`;
        }

        function parseJwt(token) {
            let base64Url = token.split('.')[1];
            let base64 = base64Url.replace(/-/g, '+').replace(/_/g, '/');
            let jsonPayload = decodeURIComponent(atob(base64).split('').map(function(c) {
                return '%' + ('0' + c.charCodeAt(0).toString(16)).slice(-2);
            }).join(''));
            return JSON.parse(jsonPayload);
        }

        function calcolaPercorso() {
            const originVal = document.getElementById("origin-input").value;
            const destinationVal = document.getElementById("destination-input").value;

            const request = {
                origin: originVal,
                destination: destinationVal,
                travelMode: google.maps.TravelMode.DRIVING,
                provideRouteAlternatives: true
            };

            directionsService.route(request, (result, status) => {
                if (status == "OK") {
                    directionsRenderer.setDirections(result);
                } else {
                    alert("Impossibile trovare il percorso inserito. Controlla i nomi delle località.");
                }
            });
        }
    </script>
</body>
</html>
